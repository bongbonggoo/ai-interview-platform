# 기본 프로필: H2 인메모리 — 최소 설정으로 바로 실행/테스트 가능하게.
# 나중에 실서비스로 갈 때 'postgres' 프로필로 전환 (DATABASE_URL 등 환경변수 주입).
spring:
  application:
    name: ai-interview-platform
  datasource:
    url: jdbc:h2:mem:aiinterview;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # MVP 단계 편의상 update. 스키마 안정화 후 Flyway/Liquibase로 전환 권장.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# 채점기: 키가 있으면 Claude, 없으면 스텁(로컬에서 키 없이 전체 흐름을 돌려볼 수 있게).
# 스텁은 내용을 판단하지 않으므로 실제 평가에 쓰면 안 된다.
ai:
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-5
    base-url: https://api.anthropic.com
    max-tokens: 2048

server:
  port: 8080
  error:
    # 서비스 계층이 던지는 한글 사유(가중치 초과, verified 수정 금지 등)를 응답에 실어준다.
    # 이게 없으면 클라이언트는 409/422 숫자만 보고 왜 막혔는지 알 수 없다.
    include-message: always

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiinterview}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
