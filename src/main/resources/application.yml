# 기본 프로필: H2 인메모리 — 최소 설정으로 바로 실행/테스트 가능하게.
# 나중에 실서비스로 갈 때 'postgres' 프로필로 전환 (DATABASE_URL 등 환경변수 주입).
spring:
  application:
    name: ai-interview-platform
  datasource:
    url: jdbc:h2:mem:aiinterview;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # MVP 단계 편의상 update. 스키마 안정화 후 Flyway/Liquibase로 전환 권장.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiinterview}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
