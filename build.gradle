plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    // 프론트엔드를 백엔드 빌드에 태운다. Node가 없으면 알아서 받아오므로
    // 사용자는 ./gradlew bootRun 하나만 실행하면 된다.
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.aiinterview'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ---- 프론트엔드 ----

node {
    version = '22.11.0'
    download = true                       // Node 미설치 환경에서도 동작
    nodeProjectDir = file('frontend')
}

tasks.named('npmInstall') {
    // package.json / lock이 그대로면 다시 설치하지 않는다.
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
}

tasks.register('buildFrontend', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.files('frontend/package.json', 'frontend/vite.config.js', 'frontend/index.html')
    inputs.dir('frontend/src')
    outputs.dir('frontend/dist')
}

// 빌드 결과를 정적 리소스로 넣어 8080 한 포트에서 화면과 API가 같이 서빙되게 한다.
tasks.named('processResources') {
    dependsOn tasks.named('buildFrontend')
    from('frontend/dist') {
        into 'static'
    }
}
